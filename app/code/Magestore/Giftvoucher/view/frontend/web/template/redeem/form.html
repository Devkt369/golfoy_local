<dl id="giftvoucher_container" class="gift-card" data-bind="visible:(!isBuyingGiftcard() && canDisplay())">
    <dt class="form-group giftvoucher">
        <input type="checkbox" name="payment[giftvoucher]" id="giftvoucher" data-bind="checked:useGiftcard" />
        <label for="giftvoucher" data-bind="i18n:'Use Gift Card to check out'"></label>
    </dt>
    <dd class="giftvoucher" data-bind="visible:useGiftcard">
        <ul id="payment_form_giftvoucher">
         <li class="giftvoucher-discount-code form-group" data-bind="visible:hasUsingCodes">
                <ul data-bind="foreach:usingCodes">
                    <li class="form-group">
                        <div class="">
                            
                            <span class="giftvoucher-line">Used gift card:</span><label for="giftvoucher"
                                data-bind="text:code" style="font-weight: bold;"></label>
                            <div class="coupon_expiry" style="font-size: 11px;
                            display: block;">    
                                <span class="giftvoucher_remained" id="remainedAmt">Remaining Balance:</span>
                                <label class="remaining-label-gift" for="giftremain" data-bind="text: REMAINED"></label>
                                <span class="giftvoucher-expiry" id="expired_at" data-bind="visible: DAYS">Expire In:</span><label for="giftexpiry" data-bind="text: DAYS"> </label>
                                <span class="Days-giftvocher">&nbsp;Days</span>
                            </div>
                             
                            <div class="gift-voucher-inline-block">
                                <input onfocus="this.select()" placeholder="Customize Your Gift Card"
                                    class="form-control input-text" type="text"
                                    data-bind="value:discount, attr:{title:$t('Gift Card Amount'), id:'giftvoucher-using-code-input-'+code}, event:{keypress:$parent.scanAfter}" />
                                <a class='trash-icon' href="#"
                                    data-bind="i18n:'Remove', attr:{title:$t('Remove')}, click: $parent.removeUsingCode"></a>
                            </div>
                            <!-- <div class="remaining-gift-card-value">You have left: <a
                                data-bind="text:$parent.getExistingCodeTitle($data)"></a>
                            </div> -->
                             <!-- <span data-bind="text:$parent.calculateRemainingAmount($data)"></span> 
                           <a href="#" data-bind="i18n:'Remove', attr:{title:$t('Remove')}, click: $parent.removeUsingCode"></a>-->
                            <!-- <div class="remaining-gift-card-value">here is the remaining price <a
                                data-bind="text:$parent.getExistingCodeTitle($data)"></a></div> -->
                        </div>
                    </li>
                </ul>
            </li>
           
            <div class="gift-input-txt row">
                <div class="gift-voucher-input">
                    <li id="giftvoucher-custom-code" class="form-group">
                        <div class="row">
                            <div class="col-xs-6">
                                <label for="giftvoucher_code" data-bind="text: $t('Apply Gift Card')"></label>
                                <input
                                    data-bind="attr:{title:$t('Gift Card Code')}, value: selectedNewCode, event:{keypress:scanAfter}"
                                    type="text" class="form-control input-text" id="giftvoucher_code"
                                    name="giftvoucher_code" placeholder="Enter Gift Card" onfocus="this.select()" />
                            </div>
                        </div>
                    </li>
                </div>
                <div class="gift-voucher-button">
                    <li class="gift-card-button">
                        <div class="input-box">
                            <button type="button" class="button" id="giftvoucher_add"
                                data-bind="attr:{title:$t('Apply')}, click:submit">
                                <span><span data-bind="text: $t('Use Gift Card')"></span></span>
                            </button>
                        </div>
                    </li>
                </div>
            </div>
            <li class="form-group" data-bind="visible:hasExistingCodes">
                <div class="row">
                    <div class="col-sm-12 col-xs-12 exising-card-offer">
                        <label for="giftvoucher_existed_code"
                            data-bind="text: $t('or select an existing Gift Card code')"></label>
                        <select data-bind="attr:{title:$t('Customer Gift Card Code')}, value:selectedExistingCode"
                            class="form-control input-select" id="giftvoucher_existed_code"
                            name="existed_giftvoucher_code">
                            <option value="" data-bind="i18n:'-- Please Select --'"></option>
                            <!--ko foreach: existingCodes-->
                            <option data-bind="value:gift_code, text:$parent.getExistingCodeTitle($data)"></option>
                            <!--/ko-->
                        </select>
                    </div>
                </div>
            </li>
            <li style="color: #eb340a;padding-left: 5px;font-size: 11px;font-weight: bold;line-height: 13px; display:none"
                id="giftcard_notice_1" data-bind="text: $t('Please enter your code')"></li>
            <li style="color: #eb340a;padding-left: 5px;font-size: 11px;font-weight: bold;line-height: 13px; display:none"
                id="giftcard_notice_2" data-bind="text: $t('Please enter or chose your code')"></li>
            <div class="col-sm-6">
            </div>
            <li class="txt-cart-line">
                <!--ko if:isGuest-->
                <!-- ko text: $t('To check your Gift card information, please click ')--><!-- /ko -->
                <a target="_blank" data-bind="text: $t('here'), attr:{href:checkCodesUrl}"></a>
                <!--/ko-->
                <!--ko ifnot:isGuest-->
                <!-- ko text: $t('To manage your Gift Card, please click ')--><!-- /ko -->
                <a target="_blank" data-bind="text: $t('here'), attr:{href:manageCodesUrl}"></a>
                <!--/ko-->
            </li>
            <p></p>
        </ul>
    </dd>
</dl>
<!--ko if:isBuyingGiftcard-->
<div class="already-giftcard">
    <!-- <h2 data-bind="i18n:'Gift Cards'"></h2> -->
    <div class="row">
        <div class="col-sm-12 gift-box-input">
            <div class="gift-voucher-input">
                <div class="row">
                    <div class="col-sm-8 col-md-8 col-xs-8 no-gift-input">
                        <li id="giftvoucher-custom-code" class="form-group">
                            <div class="row">
                                <div class="col-xs-6">
                                    <label for="giftvoucher_code" data-bind="text: $t('Gift Card')">Gift
                                        Card</label>
                                    <input
                                        data-bind="attr:{title:$t('Gift Card Code')}, value: selectedNewCode, event:{keypress:scanAfter}"
                                        type="text" class="form-control input-text" id="giftvoucher_code"
                                        name="giftvoucher_code" onfocus="this.select()" title="Gift Card Code"
                                        onclick="return false;" onmousedown="return false;" onmouseup="return false;">
                                </div>

                            </div>
                        </li>
                    </div>
                    <div class="col-sm-4 col-md-4 col-xs-4 no-gift-btn">
                        <div class="gift-voucher-button">
                            <li class="gift-card-button">
                                <div class="input-box">
                                    <button type="button" class="button disabled" id="giftvoucher_add"
                                        data-bind="attr:{title:$t('Apply')}, click:submit" title="Apply" disabled>
                                        <span><span data-bind="text: $t('Use Gift Card')">Use Gift Card</span></span>
                                    </button>
                                </div>
                            </li>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <br>
        <div class="col-sm-12 gift-box-text-line">
            <span style="font-weight: bold"
                data-bind="text: $t('Gift Cards cannot be used to purchase Gift Card products')"></span>
        </div>
    </div>
</div>
<!-- /ko -->
