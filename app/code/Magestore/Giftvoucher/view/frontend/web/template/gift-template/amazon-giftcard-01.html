<!--@vars
{"var giftImageUrl":"Gift Card Image Url",
"var logo_url":"Logo image url",
"var textColor":"Text Color",
"var styleColor":"Special Text Color",
"var senderName":"Sender Name",
"var recipientName":"Recipient Name",
"var giftMessage":"Gift Message",
"var giftValue":"Value of Gift Card",
"var giftCode":"Gift code string",
"var barcodeUrl":"Barcode image url",
"var expiredDate":"Expired Date of Gift code",
"var notes":"Gift Card notes"}
@-->
<table class="giftcard-img-block"
    style="max-width: 600px;border-radius: 4px;border-collapse: collapse;text-align: right;border-spacing: 0px;float: right;margin: 0px auto;border:2px solid rgb(202, 202, 202);">
    <tr style="display: none;">
        <td>
            <div style="text-align:center; padding:10px;">
                <img data-bind="attr: {src: logo_url}" style="height:50px" />
            </div>
        </td>
    </tr>
    <tr>
        <td>
            <div>
                <img data-bind="attr: {src: giftImageUrl}" style="width: 100%;">
            </div>
        </td>
    </tr>
    <tr>
        <td>
            <div class="gift-text-message">
                <p data-bind="text: giftMessage,style: {color: textColor}"
                    style="color:#{{var textColor}};font-family: Georgia, serif;font-size:20px;line-height:32px;margin:0;padding:30px;">
                    {{var giftMessage}}
                </p>
            </div>
        </td>
    </tr>
    <tr>
        <td>
            <div>
                <table style="width:100%;">
                    <tbody class="gift-card-img-price">
                        <tr>
                            <td valign="middle"
                                style="font-size: 40px; font-family: Arial, Helvetica, sans-serif; padding: 30px; width: 50%;">
                                <span data-bind="style: {color: styleColor}" style="color:#{{var styleColor}};">
                                    <span class="price giftvalue-card" data-bind="text: giftValue">{{var
                                        giftValue}}</span>
                                </span>
                                <span data-bind="style: {color: styleColor}"
                                    style="color:#{{var styleColor}};font-size:18px; font-family:Arial,Helvetica,sans-serif; display:block;">
                                    <span class="giftCode" data-bind="text: giftCode">{{var giftCode}}</span>
                                </span>
                            </td>
                            <td rowspan="2" valign="middle"
                                style="padding: 30px; text-align: right; width: 50%;display: none;">
                                <img data-bind="attr: {src: barcodeUrl}" />
                                <!-- ko if: expiredDate-->
                                <div data-bind="text: expiredDate, style: {color: textColor}"
                                    style="color:#{{var textColor}};text-align:center;">
                                    {{if expiredDate}} Expired: {{var expiredDate}} {{/if}}
                                </div>
                                <!-- /ko -->
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </td>
    </tr>
    <tr>
        <td>
            <div>
                <p data-bind="style: {color: textColor}, text: notes"
                    style="color:#{{var textColor}};font-family: Georgia, serif;font-size:12px;font-style:italic;margin:0;padding:30px;display:none;">
                    {{var notes}}
                </p>
            </div>
        </td>
    </tr>
</table>
