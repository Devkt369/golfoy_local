<!-- ko if: !isCustomerLoggedIn() -->
<div class="shipping-login">
    <div class="modal fade shipping-login" id="signon_button" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content" id="loginModalContent">
                <div class="modal-body" id="modal-body_sso">
                    <div class="sign-up-forms-details">
                        <form name="login-number" id="login-number" action="#">
                            <div class="sign-up-content">
                                <div class="login-heading">
                                    <img src="https://golfoy.com/media/logo/stores/1/Golfoy.png"
                                        title="Golfoy.com: India Online Golf Shop"
                                        alt="Golfoy.com India Online Golf Shop" width="403" height="103">
                                    <p>Sign up for a faster checkout experience in future</p>
                                </div>
                                <div class="input_form_div">
                                    <div class="form-group">
                                        <div class="mobile-number-login__dateSlct">+91</div>
                                        <input type="text"
                                            oninput="javascript: if (this.value.length > 10) this.value = this.value.slice(0, 10);"
                                            maxlength="10" class="mobile-number-login__form_control"
                                            name="mobileNumber" placeholder="Enter Mobile Number"
                                            autocomplete="off" id="mobileNumber" value="">
                                    </div>
                                </div>
                                <h2 class="use-email" id="use_email">Sign in using E-mail</h2>
                                <div class="terms-condition-content">
                                    <p>On Clicking Continue, I agree to <a
                                            href="https://golfoy.com/terms-and-conditions"
                                            class="acnhor_page">Terms of Service</a><a
                                            href="https://golfoy.com/privacy-policy-cookie-restriction-mode"
                                            class="acnhor_page"> & Privacy Policy </a>
                                    </p>
                                </div>
                                <div class="submit_form_button">
                                    <button class="sbmt_btn" type="">continue</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /ko -->
 
<!-- ko if: isCustomerLoggedIn() -->
<li id="shipping" class="checkout-shipping-address" data-bind="fadeVisible: visible()">
    <div class="step-title shipping-title-form" translate="'Shipping Address'" data-role="title"></div><span
        class="cross-btn-shipping"></span>
    <div id="checkout-step-shipping" class="step-content" data-role="content">
        <each if="!quoteIsVirtual" args="getRegion('customer-email')" render=""></each>
        <each args="getRegion('address-list')" render=""></each>
        <each args="getRegion('address-list-additional-addresses')" render=""></each>

        <!-- Address form pop up -->
        <if args="!isFormInline">
            <div class="new-address-popup">
                <button type="button" class="action action-show-popup" click="showFormPopUp"
                    visible="!isNewAddressAdded()">
                    <span translate="'New Address'"></span>
                </button>
            </div>
            <div id="opc-new-shipping-address" visible="isFormPopUpVisible()" render="shippingFormTemplate"></div>
        </if>

        <each args="getRegion('before-form')" render=""></each>

        <!-- Inline address form -->
        <render if="isFormInline" args="shippingFormTemplate"></render>
    </div>
</li>

<!--Shipping method template-->
<li id="opc-shipping_method" class="checkout-shipping-method" data-bind="fadeVisible: visible(), blockLoader: isLoading"
    role="presentation">
    <div class="checkout-shipping-method">
        <div class="step-title" translate="'Shipping Methods'" data-role="title"></div>

        <each args="getRegion('before-shipping-method-form')" render=""></each>

        <div id="checkout-step-shipping_method" class="step-content" data-role="content" role="tabpanel"
            aria-hidden="false">
            <form id="co-shipping-method-form" class="form methods-shipping" if="rates().length"
                submit="setShippingInformation" novalidate="novalidate">

                <render args="shippingMethodListTemplate"></render>

                <div id="onepage-checkout-shipping-method-additional-load">
                    <each args="getRegion('shippingAdditional')" render=""></each>
                </div>
                <div role="alert" if="errorValidationMessage().length" class="message notice">
                    <span text="errorValidationMessage()"></span>
                </div>
                <div class="actions-toolbar" id="shipping-method-buttons-container">
                    <div class="primary">
                        <button data-role="opc-continue" type="submit" class="button action continue primary">
                            <span translate="'Next'"></span>
                        </button>
                    </div>
                </div>
            </form>
            <div class="no-quotes-block" ifnot="rates().length > 0"
                translate="'Sorry, no quotes are available for this order at this time'"></div>
        </div>
    </div>
</li>
<!-- /ko -->
